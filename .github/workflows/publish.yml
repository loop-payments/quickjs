name: Publish to GitHub Packages

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@loop-payments'

      - name: Verify the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "The release tag ${TAG} does not match the package version ${VERSION}."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Generate the vendored modules
        run: bun run build:vendor

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: |
          set -euo pipefail
          for f in $(find src -type f -name '*.test.ts' | sort); do
            echo "Running $f"
            if ! bun test "$f"; then
              echo "Retrying $f once after failure..."
              bun test "$f"
            fi
          done

      - name: Build
        run: bun run build

      - name: Publish
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
